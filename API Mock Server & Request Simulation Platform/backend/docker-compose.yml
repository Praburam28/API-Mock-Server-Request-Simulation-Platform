services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: api_mock_backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - .:/app


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: api_mock_frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ../frontend:/app
      - /app/node_modules


  mysql:
    image: mysql:8.0

    container_name: api_mock_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: api_mock_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  mysql_data:

  redis_data: